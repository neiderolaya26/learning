name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate JSON
        run: git ls-files '*.json' | xargs -r -n1 python3 -m json.tool > /dev/null
      - name: Check inline JavaScript in HTML
        run: node .github/scripts/check_html.mjs
      - name: Check Python syntax
        run: git ls-files '*.py' | xargs -r python3 -m py_compile
